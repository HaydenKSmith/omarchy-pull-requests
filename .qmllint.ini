[General]
DisableDefaultImports=false
MaxWarnings=-1

[Warnings]
# `bar` is declared `property QtObject bar` by the Omarchy shell host, and the
# Style/Color singletons expose their tokens through nested untyped QtObjects
# (Style.font.body, Style.bar.iconFont, ...). qmllint cannot see through
# either, so every access to them is reported. Nothing here is fixable from
# this plugin without changing Omarchy itself.
MissingProperty=disable

# Quickshell's Process.exited signal carries a QProcess::ExitStatus parameter
# whose type is not registered with the QML type system. Every first-party
# Omarchy plugin that handles onExited trips this too.
BadSignalHandlerParameters=disable
